# A tag "dial-vX.Y.Z" builds firmware/dial-idf and publishes build/orion-dial.bin
# to a GitHub Release; dial_ota.c polls that release's tag_name/asset to decide
# whether a device should update, so the tag must match CMakeLists.txt's PROJECT_VER.
# The same build also produces a merged single-file image (bootloader + partition
# table + otadata + app, flashable from offset 0x0) via `esptool merge-bin`, which
# is attached to the release as orion-dial-merged.bin and deployed to GitHub Pages
# (gh-pages branch) at firmware/latest/orion-dial-merged.bin so the browser-based
# ESP Web Tools flasher page (web-flasher/) always points at the latest build.
name: release

on:
  push:
    tags:
      - 'dial-v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify tag matches PROJECT_VER
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#dial-v}"
          PROJECT_VER="$(grep -oP 'set\(PROJECT_VER\s+"\K[^"]+' firmware/dial-idf/CMakeLists.txt)"
          if [ -z "$PROJECT_VER" ]; then
            echo "::error::Could not find PROJECT_VER in firmware/dial-idf/CMakeLists.txt"
            exit 1
          fi
          if [ "$TAG_VERSION" != "$PROJECT_VER" ]; then
            echo "::error::Tag $GITHUB_REF_NAME (version $TAG_VERSION) does not match PROJECT_VER $PROJECT_VER in firmware/dial-idf/CMakeLists.txt"
            exit 1
          fi
          echo "Tag version $TAG_VERSION matches PROJECT_VER $PROJECT_VER"

      # Beta channel: a tag like dial-v1.1.0-beta.1 publishes as a GitHub
      # PRERELEASE. That single flag is what keeps the two channels apart —
      # /releases/latest (what a stable dial polls, and what the flasher's
      # default manifest serves) excludes prereleases by definition, so only
      # devices with "Beta builds" on, which read the full releases list,
      # ever see these.
      - name: Classify release channel
        id: channel
        run: |
          if [[ "$GITHUB_REF_NAME" == *-beta.* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "pages_dir=beta"  >> "$GITHUB_OUTPUT"
            echo "Channel: BETA (prerelease)"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "pages_dir=latest" >> "$GITHUB_OUTPUT"
            echo "Channel: STABLE"
          fi

      - name: Build firmware and merge flashable image (firmware/dial-idf)
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v6.0
          target: esp32s3
          path: 'firmware/dial-idf'
          command: idf.py build && cd build && python -m esptool --chip esp32s3 merge-bin -o orion-dial-merged.bin @flash_args

      - name: Upload merged image for the Pages job
        uses: actions/upload-artifact@v4
        with:
          name: orion-dial-merged
          path: firmware/dial-idf/build/orion-dial-merged.bin
          retention-days: 1

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ steps.channel.outputs.prerelease }}
          files: |
            firmware/dial-idf/build/orion-dial.bin
            firmware/dial-idf/build/orion-dial-merged.bin

  deploy-pages:
    needs: build-and-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download merged image
        uses: actions/download-artifact@v4
        with:
          name: orion-dial-merged
          path: /tmp/orion-dial-merged

      # Each channel owns its own directory: a beta deploy must never
      # overwrite the image that the flasher's default (stable) manifest
      # serves. keep_files below is what preserves the other channel's
      # directory across deploys.
      - name: Channel directory
        id: channel
        run: |
          if [[ "$GITHUB_REF_NAME" == *-beta.* ]]; then
            echo "dir=beta" >> "$GITHUB_OUTPUT"
          else
            echo "dir=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Assemble Pages site
        run: |
          mkdir -p _site/firmware/${{ steps.channel.outputs.dir }}
          cp web-flasher/index.html web-flasher/manifest.json web-flasher/manifest-beta.json _site/
          cp /tmp/orion-dial-merged/orion-dial-merged.bin \
             _site/firmware/${{ steps.channel.outputs.dir }}/orion-dial-merged.bin

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          # NOT force_orphan: that wipes the branch on every deploy, which
          # would delete the OTHER channel's firmware image. keep_files
          # preserves firmware/latest/ when a beta publishes and vice versa.
          keep_files: true
